# ──────────────────────────────────────────────────────────────
# Fleet Configuration
# ──────────────────────────────────────────────────────────────
#
# defaults  — physical limits used for any UAV that does not
#             override them individually.
#
# uavs      — list of UAV mission configs.
#   Required per UAV: id, start [x, y, z], goal [x, y, z]
#   Optional per UAV: v_max, a_max, radius  (fall back to defaults)
#
# Scenario: three UAVs travel from the west side (x ≈ 5-10) to the
# east side (x ≈ 90) of the 100×100×20 m world.  All three fly at
# z = 5 m, which is below the passage walls (h = 20 m), so they
# cannot fly over them.  The only opening through the wall at
# x ∈ [48, 52] is the gap at y ∈ [48.5, 51.5] — forcing all three
# UAVs to queue through the same narrow passage and creating the
# space-time conflicts we want to resolve.
# ──────────────────────────────────────────────────────────────

defaults:
  v_max:  5.0    # m/s   — maximum speed
  a_max:  3.0    # m/s²  — maximum acceleration
  radius: 0.5    # m     — safety radius for inter-UAV collision avoidance

uavs:
  - id:    uav_0
    start: [ 5.0, 10.0, 5.0]
    goal:  [90.0, 10.0, 5.0]

  - id:    uav_1
    start: [ 5.0, 50.0, 5.0]
    goal:  [90.0, 50.0, 5.0]

  - id:    uav_2
    start: [ 5.0, 90.0, 5.0]
    goal:  [90.0, 90.0, 5.0]
