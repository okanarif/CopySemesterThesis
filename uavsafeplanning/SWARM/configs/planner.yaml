# ──────────────────────────────────────────────────────────────
# Planner Configuration
# ──────────────────────────────────────────────────────────────
#
# astar
#   connectivity : neighbour directions used by the A* search.
#                  6  = face-adjacent only  (Manhattan moves)
#                  18 = face + edge         (no body-diagonal)
#                  26 = face + edge + corner (full 3-D diagonal)
#                  26 recommended — gives shorter, smoother paths.
#
#   clearance    : voxel buffer kept around obstacles during the
#                  line-of-sight (LOS) pruning step.
#                  0 = no margin  (path may graze obstacle surface)
#                  1 = one-voxel margin  (= resolution metres, recommended)
#
# safe_corridor
#   box_half_extents : [bx, by, bz]  — half-sizes of the seed box used to
#                      initialise each convex corridor around a path segment.
#                      Given in metres (world coordinates).
#                      The algorithm inflates / shrinks this box until it fits
#                      inside the free space.  Tune this to trade corridor
#                      tightness vs. coverage.
# ──────────────────────────────────────────────────────────────

astar:
  connectivity:     18    # 6 | 18 | 26
  clearance:        0     # voxels of safety margin during LOS pruning
  inflation_radius: 0.5   # metres — obstacle inflation for safer paths (0 = disabled)

safe_corridor:
  box_half_extents: [5.0, 5.0, 5.0]   # seed box half-extents [m]

# ── STO trajectory optimizer ─────────────────────────────────────────────────
#
# max_iter           : total L-BFGS iterations (spread across phases)
# lambda_jerk        : weight for jerk-energy objective  (never changes)
# lambda_time        : weight for total-time objective    (never changes)
# lambda_vel         : final weight for velocity-violation penalty
# lambda_acc         : final weight for acceleration-violation penalty
# lambda_corridor    : final weight for corridor-violation penalty
# corridor_cost_type : penalty formulation  l2 | l1 | log
# learn_rate         : L-BFGS learning rate
# adaptive_weights   : ramp up constraint weights over phases (recommended)
# weight_phases      : number of escalation phases
# weight_scale_factor: multiplier applied at each phase boundary
# n_samples          : trajectory sample count for result extraction
# ─────────────────────────────────────────────────────────────────────────────
# ── Conflict detector ────────────────────────────────────────────────────────
#
# safety_margin : extra separation buffer added on top of the two UAVs'
#                 combined physical radii  (r_i + r_j + safety_margin).
#                 0.0 = hard-sphere check only.
#                 Increase for a conservative no-fly-zone around each drone.
#
# dt_sample     : time-grid resolution used to interpolate the STO
#                 trajectories for proximity evaluation  [s].
#                 Smaller = finer temporal resolution, higher cost.
# ─────────────────────────────────────────────────────────────────────────────
conflict_detection:
  safety_margin: 9.0    # m  — extra buffer on top of r_i + r_j
  dt_sample:     0.05   # s  — time-grid step (50 ms)

sto:
  max_iter:           50
  lambda_jerk:        10.0
  lambda_time:        0.05
  lambda_vel:         120.0
  lambda_acc:         5.0
  lambda_corridor:    1000.0
  corridor_cost_type: l2        # l1 | l2 | log
  learn_rate:         0.05
  adaptive_weights:   true
  weight_phases:      3
  weight_scale_factor: 5.0
  n_samples:          300       # sample count for trajectory evaluation

# ── Conflict-resolution replanning ──────────────────────────────────────────
#
# lambda_time_replan : overrides sto.lambda_time during replanning so the
#                      optimiser does not fight to reclaim the injected delay.
#                      Set lower than sto.lambda_time.
#
# max_replan_rounds  : maximum detect → replan iterations.
#
# replan_max_iter    : L-BFGS iteration budget per individual replan call.
#
# min_delta_t        : minimum temporal delay added to the loser's
#                      pre-violation segment [s].  Guards against degenerate
#                      near-zero-duration violations.
#
# delta_t_scale      : multiplier applied to the raw violation duration when
#                      computing the delay:
#                        Δt = max(violation_duration * delta_t_scale, min_delta_t)
#                      1.0 = full violation duration (conservative).
#                      0.6-0.8 = usually sufficient; combine with more
#                      max_replan_rounds if needed.
# ─────────────────────────────────────────────────────────────────────────────
replanning:
  lambda_time_replan: 0.01
  max_replan_rounds:  4
  replan_max_iter:    50
  min_delta_t:        0.3
  delta_t_scale:      0.4
