# ──────────────────────────────────────────────────────────────
# Environment Configuration — HARD
# ──────────────────────────────────────────────────────────────
#
# Complex environment with high obstacle density and narrow passages.
# Features:
#   - 30 cylindrical obstacles (extremely dense forest scenario)
#   - Single narrow passage (3 m gap) forcing bottleneck
#   - Requires advanced conflict resolution and coordination
#   - 100×100 m world with obstacles distributed throughout
# ──────────────────────────────────────────────────────────────

world:
  x_range:    [0.0, 100.0]
  y_range:    [0.0, 100.0]
  z_range:    [0.0, 20.0]
  resolution: 0.5          # metres per voxel  →  200 × 200 × 40 = 1 600 000 voxels

obstacles:

  # ── Cylindrical obstacles ────────────────────────────────────
  # Very dense forest with obstacles distributed across the 100×100 m world.
  cylinders:
