  # ── Rectangular wall obstacles ───────────────────────────────
  # Single narrow passage forcing all UAVs through a 3 m bottleneck.
  # The gap is at y ∈ [48.5, 51.5] (center of 100×100 world) → 3 m wide
  # Walls extend the full length of the world (x = 0 to 100 m)
  walls:
    - id:      "passage_wall_south"
      corners:
        - [48.0,   0.0]
        - [52.0,   0.0]
        - [52.0,  48.5]
        - [48.0,  48.5]
      height: 20.0

    - id:      "passage_wall_north"
      corners:
        - [48.0,  51.5]
        - [52.0,  51.5]
        - [52.0, 100.0]
        - [48.0, 100.0]
      height: 20.0
